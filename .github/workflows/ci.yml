name: CI

on:
  push:
    branches: [main, master, 0.6.0-repair]
  pull_request:
    branches: [main, master, 0.6.0-repair]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: pnpm rebuild

      - name: Build runtime identity addon
        run: pnpm run build:native-identity

      - name: Typecheck
        run: pnpm run typecheck

      # Dead CSS is this repo's largest silent-error surface: deleting the wrong
      # rule breaks styling with no compiler error and no failing test, which is
      # why 148 orphan blocks had to be removed by hand. Warn-only by default -
      # it reports orphans and undefined classes, then exits 0. Promote it to a
      # gate by adding --fail once the orphan list is empty.
      - name: CSS orphan check (warn only)
        run: node scripts/check-css-orphans.mjs

      - name: Build
        run: pnpm run build

      # Ghostty is the terminal, so CI must build and exercise the native
      # surface. Without this the E2E suite would fall back to xterm and stop
      # proving anything about the shipped renderer.
      - uses: ./.github/actions/native-terminal

      - name: Build native terminal (Ghostty)
        run: pnpm run build:native-terminal

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build native history engine
        run: pnpm run build:native-history

      - name: Verify packaged native terminal
        run: pnpm run package:check

      - name: Test
        run: pnpm run test

      - name: E2E Smoke
        run: npx playwright test

  native-identity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build runtime identity addon
        run: pnpm run build:native-identity
      - name: Test Windows generic-rights DACL fixture
        if: matrix.platform == 'win32'
        shell: bash
        run: native/runtime-identity/build/Release/windows-private-dacl-fixture.exe

      - name: Test runtime identity addon
        run: pnpm run test:native-identity

      # The macOS package ships Ghostty as its terminal, so the native surface is
      # built here and verified by package:check inside package:prepare.
      - uses: ./.github/actions/native-terminal
        if: matrix.platform == 'darwin'

      - name: Build directory package
        run: pnpm run package:dir

      - name: Locate packaged resources
        id: packaged-resources
        shell: bash
        run: |
          candidates_file=$(mktemp)
          trap 'rm -f "$candidates_file"' EXIT
          find dist -type f -path '*/native/runtime-identity.node' -print0 |
            while IFS= read -r -d '' addon; do
              candidate=$(dirname "$(dirname "$addon")")
              if test -f "$candidate/native/runtime-identity-build.json"; then
                printf '%s\n' "$candidate"
              fi
            done | sort -u > "$candidates_file"
          count=$(wc -l < "$candidates_file")
          if test "$count" -ne 1; then
            printf 'Expected exactly one packaged runtime identity resource directory, found %s:\n' "$count" >&2
            while IFS= read -r candidate; do printf '  %s\n' "$candidate" >&2; done < "$candidates_file"
            exit 1
          fi
          resources=$(<"$candidates_file")
          printf 'path=%s\n' "$resources" >> "$GITHUB_OUTPUT"

      - name: Check packaged runtime identity bytes
        shell: bash
        run: |
          arch=$(node -p "process.arch")
          node scripts/check-package.mjs --resources "${{ steps.packaged-resources.outputs.path }}" --platform "${{ matrix.platform }}" --arch "$arch"

  task-authority:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build runtime identity addon
        run: pnpm run build:native-identity

      - name: Task Authority race, migration, and recovery proofs
        run: >-
          pnpm exec vitest run
          src/main/task-authority/task-authority.test.ts
          src/main/task-authority/task-authority-races.test.ts
          src/main/task-authority/task-authority-migration.test.ts
          src/main/task-authority/task-execution-coordinator.test.ts
          src/main/task-authority/task-projections.test.ts
          src/main/task-authority/task-evidence-port.test.ts
          src/main/profile-maintenance-gate.test.ts
          src/main/runtime-identity.test.ts
          src/main/runtime-ownership.test.ts

      - name: Provider Authority catalog, secrets, launch, and migration proofs
        run: >-
          pnpm exec vitest run
          src/main/provider-catalog.test.ts
          src/main/provider-secret-broker.test.ts
          src/main/provider-secret-authority.test.ts
          src/main/provider-launch.test.ts
          src/main/provider-instance-launch.test.ts
          src/main/provider-migration.test.ts
          src/main/provider-maintenance-migration.test.ts
          src/main/agents/provider-certifications.test.ts
          src/renderer/src/components/settings/provider-instances-state.test.ts
          src/main/disclosure-census.test.ts
          src/main/secret-output-redactor.test.ts
          src/main/project-temporal-knowledge.test.ts

      - uses: ./.github/actions/native-terminal
        if: matrix.platform == 'darwin'

      - name: Build directory package
        run: pnpm run package:dir

      - name: Locate directory package executable
        shell: bash
        run: |
          executable=$(find dist -type f \( -name donwells -o -name donwells.exe \) -print -quit)
          if test -z "$executable"; then
            printf 'Directory package executable was not found\n' >&2
            exit 1
          fi
          printf 'DONWELLS_ELECTRON_EXECUTABLE=%s/%s\n' "$PWD" "$executable" >> "$GITHUB_ENV"

      - name: Run packaged Electron smoke and provider backend evidence
        if: matrix.platform != 'linux'
        run: pnpm exec playwright test e2e/smoke.e2e.ts e2e/provider-backend.e2e.ts

      - name: Run packaged Electron smoke and provider backend evidence on Linux
        if: matrix.platform == 'linux'
        run: dbus-run-session -- xvfb-run --auto-servernum pnpm exec playwright test e2e/smoke.e2e.ts e2e/provider-backend.e2e.ts
